<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>放松漂浮 · 夜色</title>
<style>
  :root{
    --bg-1:#eef1f8; --bg-2:#d8dfef; --bg-3:#c9d2e6;
    --card:rgba(255,255,255,.72); --line:#c3cde2;
    --text:#1e2740; --dim:#5d6a86; --accent:#2f3f63; --accent-soft:#e4e9f4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    margin:0;padding:24px 18px;display:flex;justify-content:center;align-items:center;
    background:
      radial-gradient(80% 55% at 50% 0%,#ffffff 0%,rgba(255,255,255,0) 65%),
      linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 55%,var(--bg-3) 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  .app{width:100%;max-width:430px;display:flex;flex-direction:column;gap:26px;align-items:center}

  header{text-align:center}
  h1{margin:0;font-size:16px;font-weight:600;letter-spacing:1px;color:#1a2340}
  header p{margin:7px 0 0;font-size:11.5px;color:var(--dim);letter-spacing:.3px}

  .dial{position:relative;width:min(72vw,290px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-linecap:round}
  .ring .track{stroke:#ffffff;stroke-width:6;opacity:.85}
  .ring .prog{stroke:var(--accent);stroke-width:6;transition:stroke-dashoffset .25s linear}

  .readout{position:relative;text-align:center}
  #time{
    font-size:clamp(42px,12vw,54px);font-weight:300;letter-spacing:2px;
    font-variant-numeric:tabular-nums;line-height:1;color:#1a2340;
  }
  #hint{margin-top:10px;font-size:12px;color:var(--dim);letter-spacing:.5px;min-height:16px}

  .actions{display:flex;align-items:center;gap:10px}
  .primary{
    font:inherit;font-size:14.5px;font-weight:600;letter-spacing:1px;
    padding:13px 44px;border-radius:999px;border:none;cursor:pointer;
    background:linear-gradient(180deg,#4a5c85,#2f3f63);color:#f2f5fb;
    box-shadow:0 8px 20px rgba(18,90,105,.3),inset 0 1px 0 rgba(255,255,255,.22);
    transition:transform .1s,box-shadow .15s;
  }
  .primary:active{transform:translateY(1px);box-shadow:0 4px 12px rgba(18,90,105,.26)}
  .ghost{
    font:inherit;font-size:13px;padding:11px 18px;border-radius:999px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);color:var(--dim);
  }
  .ghost:hover{color:var(--text);border-color:#b9c5dd}
  .ghost[hidden]{display:none}

  .settings{width:100%;background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:13px;box-shadow:0 10px 26px rgba(90,120,130,.08)}
  .row{display:flex;align-items:center;gap:10px}
  .label{font-size:11.5px;color:var(--dim);letter-spacing:1px;min-width:34px;flex-shrink:0}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{
    font:inherit;font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer;
    background:#fff;border:1px solid var(--line);color:#5d6a86;transition:.15s;
  }
  .chips button:hover:not(:disabled){border-color:#b9c5dd;color:#2f3f63}
  .chips button.on{background:var(--accent-soft);border-color:#b9c5dd;color:var(--accent);font-weight:600}
  .chips button:disabled{opacity:.45;cursor:not-allowed}

  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;
    background:#ccd5e6;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--accent);box-shadow:0 2px 6px rgba(70,120,114,.35);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border:none;border-radius:50%;
    background:var(--accent);cursor:pointer;
  }
  #volVal{font-size:11.5px;color:var(--dim);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}

  @media (max-height:760px){
    .app{gap:18px}
    .dial{width:min(54vh,250px)}
    .settings{padding:12px 14px;gap:10px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>放松漂浮 · 夜色</h1>
    <p>篝火与烛火 · 到点轻响一声</p>
  </header>

  <div class="dial">
    <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="92"></circle>
      <circle class="prog" id="prog" cx="100" cy="100" r="92"></circle>
    </svg>
    <div class="readout">
      <div id="time">45:00</div>
      <div id="hint">准备开始</div>
    </div>
  </div>

  <div class="actions">
    <button id="btnMain" class="primary" type="button">开始</button>
    <button id="btnReset" class="ghost" type="button" hidden>重置</button>
  </div>

  <section class="settings">
    <div class="row">
      <span class="label">时长</span>
      <div class="chips" id="chips">
        <button type="button" data-min="5">五分钟</button>
        <button type="button" data-min="15">一刻</button>
        <button type="button" data-min="30">两刻</button>
        <button type="button" data-min="45" class="on">三刻</button>
      </div>
    </div>
    <div class="row">
      <span class="label">声音</span>
      <div class="chips" id="sounds">
        <button type="button" data-sound="fire" class="on">篝火</button>
        <button type="button" data-sound="rain">夜雨</button>
        <button type="button" data-sound="candle">烛火</button>
        <button type="button" data-sound="wind">夜风</button>
      </div>
    </div>
    <div class="row">
      <span class="label">音量</span>
      <input id="vol" type="range" min="0" max="100" value="55">
      <span id="volVal">55</span>
    </div>
  </section>
</div>

<script>
'use strict';

/* ============================================================
   0. 常量与四种 ASMR 声音
   ============================================================ */
const CFG = {
  FADE_IN: 2.5,        // 起播淡入（秒）
  FADE_OUT: 4.0,       // 计时结束淡出（秒）
  PAUSE_FADE: 0.5,     // 暂停/继续的淡化（秒）
  BROWN_SEC: 10,       // 低频噪声循环长度
  PINK_SEC: 11,        // 高频噪声循环长度（与 10 互质，叠加周期 110 秒）
  WHITE_SEC: 7,        // 白噪声，敲击颗粒用（带通后能量才够厚）
  CROSSFADE: 0.8,      // 循环接缝交叉淡化
  MAX_GAIN: 1.1        // 音量滑杆拉满时的总线增益
};

/*
  夜色版四种声音
  fire：篝火，低频呼吸 + 随机噼啪
  rain：夜雨打在帆布上，连续底噪 + 密集雨点
  candle：烛火，几秒一下的轻微爆裂，几乎没有低频
  wind：夜风，比清风版低一个八度，空旷
*/
const SOUNDS = {
  fire:    { kind: 'fire',    trim: 1.0 },
  rain:    { kind: 'rain',    trim: 1.0 },
  candle:  { kind: 'candle',  trim: 1.0 },
  wind:    { kind: 'wind',    trim: 1.0 }
};
let currentSound = 'fire';

const A = { ctx: null, ready: false, master: null, active: null };
let BUFS = null;

/* ============================================================
   1. 噪声生成
   ============================================================ */
function ensureCtx() {
  if (!A.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    A.ctx = new AC();
  }
  if (A.ctx.state === 'suspended') A.ctx.resume();
  return A.ctx;
}

/* 布朗噪声：能量偏向低频，像水流的主体 */
function fillBrown(data) {
  let last = 0;
  for (let i = 0; i < data.length; i++) {
    const white = Math.random() * 2 - 1;
    last = (last + 0.02 * white) / 1.02;
    data[i] = last * 3.5;
  }
}

/* 白噪声：能量平直，经窄带带通后仍有实心感，用来做敲击颗粒 */
function fillWhite(data) {
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
}

/* 粉红噪声（Paul Kellet 近似）：能量偏中高频，像水花细响 */
function fillPink(data) {
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < data.length; i++) {
    const white = Math.random() * 2 - 1;
    b0 = 0.99886 * b0 + white * 0.0555179;
    b1 = 0.99332 * b1 + white * 0.0750759;
    b2 = 0.96900 * b2 + white * 0.1538520;
    b3 = 0.86650 * b3 + white * 0.3104856;
    b4 = 0.55000 * b4 + white * 0.5329522;
    b5 = -0.7616 * b5 - white * 0.0168980;
    const out = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
    b6 = white * 0.115926;
    data[i] = out * 0.11;
  }
}

/*
  生成可无缝循环的噪声缓冲：
  多生成一段尾巴，把尾巴交叉淡化进开头，
  这样从末尾跳回开头时，接缝和普通相邻采样没有区别。
*/
function makeLoopBuffer(ctx, seconds, filler) {
  const sr = ctx.sampleRate;
  const n = Math.floor(seconds * sr);
  const fade = Math.floor(CFG.CROSSFADE * sr);
  const raw = new Float32Array(n + fade);
  filler(raw);

  let peak = 0;
  for (let i = 0; i < raw.length; i++) {
    const v = Math.abs(raw[i]);
    if (v > peak) peak = v;
  }
  if (peak > 0) {
    const k = 0.9 / peak;
    for (let i = 0; i < raw.length; i++) raw[i] *= k;
  }

  const buf = ctx.createBuffer(1, n, sr);
  const d = buf.getChannelData(0);
  d.set(raw.subarray(0, n));

  for (let i = 0; i < fade; i++) {
    const t = i / fade;
    d[n - fade + i] = raw[n - fade + i] * (1 - t) + raw[n + i] * t;
  }
  return buf;
}

function getBuffers(ctx) {
  if (BUFS && BUFS.sr === ctx.sampleRate) return BUFS;
  BUFS = {
    sr: ctx.sampleRate,
    brown: makeLoopBuffer(ctx, CFG.BROWN_SEC, fillBrown),
    pink: makeLoopBuffer(ctx, CFG.PINK_SEC, fillPink),
    white: makeLoopBuffer(ctx, CFG.WHITE_SEC, fillWhite)
  };
  return BUFS;
}

/* ============================================================
   2. 包络调度（湖浪用）
   ============================================================ */
/*
  在未来的时间轴上连续排布"涨—落"包络。
  每 300ms 向前看 2 秒，保证自动化曲线不会断档。
*/
function scheduleSwells(ctx, param, o) {
  let next = ctx.currentTime + 0.5;
  let first = true;

  param.setValueAtTime(param.value, ctx.currentTime);

  const timer = setInterval(function () {
    const now = ctx.currentTime;
    let guard = 0;

    while (next < now + 2.0 && guard++ < 12) {
      const gap = o.minGap + Math.random() * (o.maxGap - o.minGap);
      const peak = o.minPeak + Math.random() * (o.maxPeak - o.minPeak);
      const floor = o.minFloor + Math.random() * (o.maxFloor - o.minFloor);
      const rise = o.rise * (0.7 + Math.random() * 0.6);

      // 第一段用 ramp 接住初始值，避免切换瞬间的阶跃产生咔哒声
      if (first) {
        param.linearRampToValueAtTime(Math.max(0.0001, floor), next);
        first = false;
      } else {
        param.setValueAtTime(Math.max(0.0001, floor), next);
      }
      param.linearRampToValueAtTime(Math.max(0.0001, peak), next + rise);
      param.linearRampToValueAtTime(Math.max(0.0001, floor), next + gap);

      next += gap;
    }
  }, 300);

  return function () { clearInterval(timer); };
}

/*
  笔画调度：起—持—落—停 四段。
  与 scheduleSwells 的区别是「停」这一段真的回到零，
  所以整体有约 20% 的静默时间——手离开、换方向的那一下。
*/
function scheduleStrokes(ctx, param, o) {
  let next = ctx.currentTime + 0.3;
  param.setValueAtTime(0.0001, ctx.currentTime);

  const fill = function (until) {
    let guard = 0;

    while (next < until && guard++ < 64) {
      const atk = o.minAtk + Math.random() * (o.maxAtk - o.minAtk);
      const hold = o.minHold + Math.random() * (o.maxHold - o.minHold);
      const rel = o.minRel + Math.random() * (o.maxRel - o.minRel);
      const rest = o.minRest + Math.random() * (o.maxRest - o.minRest);
      const peak = o.minPeak + Math.random() * (o.maxPeak - o.minPeak);

      const up = next + atk;
      const down = up + hold;
      const off = down + rel;

      param.setValueAtTime(0.0001, next);
      param.linearRampToValueAtTime(peak, up);
      param.setValueAtTime(peak, down);
      param.linearRampToValueAtTime(0.0001, off);

      next = off + rest;
    }
  };

  /* 先把未来 3 秒排满，再挂定时器续上 */
  fill(ctx.currentTime + 5.0);

  const timer = setInterval(function () {
    fill(ctx.currentTime + 2.5);
  }, 250);

  return function () { clearInterval(timer); };
}

/* ============================================================
   3. 夜色发声单元
   ============================================================ */

/*
  通用调度：先把未来 prefill 秒排满，再挂定时器续上。
  好处是离线渲染也能测到，实际运行也不会因 setInterval 抖动出现空档。
  step 接收当前时间，返回下一次的时间。
*/
function scheduleLoop(ctx, step, prefill, tickMs) {
  let next = ctx.currentTime + 0.2;

  const fill = function (until) {
    let guard = 0;
    while (next < until && guard++ < 240) next = step(next);
  };

  fill(ctx.currentTime + prefill);

  const timer = setInterval(function () {
    fill(ctx.currentTime + prefill * 0.6);
  }, tickMs);

  return function () { clearInterval(timer); };
}

/* 极短噪声脉冲 */
function burst(ctx, dest, t, freq, q, peak, dur, buf) {
  const src = ctx.createBufferSource();
  src.buffer = buf;

  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = freq;
  bp.Q.value = q;

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.0015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  src.connect(bp);
  bp.connect(g);
  g.connect(dest);
  src.start(t, Math.random() * 5);
  src.stop(t + dur + 0.01);
}

/* 阻尼正弦 */
function dampedTone(ctx, dest, t, f, peak, dur) {
  const osc = ctx.createOscillator();
  const g = ctx.createGain();

  osc.type = 'sine';
  osc.frequency.setValueAtTime(f, t);
  osc.frequency.exponentialRampToValueAtTime(f * 0.92, t + dur);

  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  osc.connect(g);
  g.connect(dest);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

/*
  篝火的一串噼啪：3–14 响，大小不均。
  偶尔来一下大的（木柴炸开），其余是细碎的。
*/
function fireCrackle(ctx, dest, t0, buf) {
  const n = 3 + Math.floor(Math.random() * 12);
  const dur = 0.30 + Math.random() * 1.20;

  for (let i = 0; i < n; i++) {
    const t = t0 + dur * Math.random();
    const big = Math.random() < 0.12;

    burst(
      ctx, dest, t,
      1300 + Math.random() * 4700,
      1.0 + Math.random() * 2.4,
      (big ? 0.55 : 0.17) * (0.4 + Math.random() * 0.6),
      0.004 + Math.random() * (big ? 0.030 : 0.011),
      buf
    );
  }
}

/* 雨打帆布的一小簇雨点 */
function rainTick(ctx, dest, t0, buf) {
  const n = 8 + Math.floor(Math.random() * 14);
  const dur = 0.25 + Math.random() * 0.50;

  for (let i = 0; i < n; i++) {
    burst(
      ctx, dest,
      t0 + dur * Math.random(),
      420 + Math.random() * 1500,
      1.1 + Math.random() * 1.4,
      0.09 * (0.3 + Math.random() * 0.7),
      0.004 + Math.random() * 0.008,
      buf
    );
  }
}

/*
  烛芯的爆裂：一次 1–3 声，很轻、很短。
  和篝火的区别在于稀疏和没有低频——烛火是「偶尔哔一声」，
  不是持续的热气声。
*/
function candlePop(ctx, dest, t0, buf) {
  const n = 1 + Math.floor(Math.random() * 3);
  const dur = 0.15 + Math.random() * 0.65;

  for (let i = 0; i < n; i++) {
    const t = t0 + dur * Math.random();
    const big = Math.random() < 0.07;

    burst(
      ctx, dest, t,
      900 + Math.random() * 3200,
      1.1 + Math.random() * 1.5,
      (big ? 2.25 : 0.80) * (0.4 + Math.random() * 0.6),
      0.003 + Math.random() * (big ? 0.018 : 0.008),
      buf
    );
  }
}

/* ============================================================
   4. 声音构建
   ============================================================ */
function buildSound(ctx, name) {
  const cfg = SOUNDS[name] || SOUNDS.breeze;
  const buf = getBuffers(ctx);

  const out = ctx.createGain();
  out.gain.value = 0;

  const kill = [];
  const trackNode = function (node) {
    kill.push(function () { try { node.stop(); } catch (err) {} });
  };
  const trackFn = function (fn) { kill.push(fn); };

  if (cfg.kind === 'fire') {
    /* 低频底：火在呼吸 */
    const srcLow = ctx.createBufferSource();
    srcLow.buffer = buf.brown;
    srcLow.loop = true;

    const lpLow = ctx.createBiquadFilter();
    lpLow.type = 'lowpass';
    lpLow.frequency.value = 215;
    lpLow.Q.value = 0.7;

    const lowGain = ctx.createGain();
    lowGain.gain.value = 0.42;

    srcLow.connect(lpLow);
    lpLow.connect(lowGain);
    lowGain.connect(out);
    srcLow.start(0, Math.random() * 3);
    trackNode(srcLow);

    trackFn(scheduleStrokes(ctx, lowGain.gain, {
      minAtk: 0.7, maxAtk: 1.8, minHold: 0.4, maxHold: 1.4,
      minRel: 0.7, maxRel: 1.8, minRest: 0.02, maxRest: 0.06,
      minPeak: 0.42, maxPeak: 0.68
    }));

    /* 中频嘶声：火苗的「呼」 */
    const srcMid = ctx.createBufferSource();
    srcMid.buffer = buf.pink;
    srcMid.loop = true;

    const bpMid = ctx.createBiquadFilter();
    bpMid.type = 'bandpass';
    bpMid.frequency.value = 780;
    bpMid.Q.value = 0.8;

    const midGain = ctx.createGain();
    midGain.gain.value = 0.08;

    srcMid.connect(bpMid);
    bpMid.connect(midGain);
    midGain.connect(out);
    srcMid.start(0, Math.random() * 3);
    trackNode(srcMid);

    /* 噼啪 */
    trackFn(scheduleLoop(ctx, function (t) {
      fireCrackle(ctx, out, t, buf.white);
      return t + 0.18 + Math.random() * 0.55;
    }, 4.0, 250));

  } else if (cfg.kind === 'rain') {
    /* 雨打帆布：中频主体 + 低频闷响 + 细密高频 */
    const srcA = ctx.createBufferSource();
    srcA.buffer = buf.pink;
    srcA.loop = true;

    const lpA = ctx.createBiquadFilter();
    lpA.type = 'lowpass';
    lpA.frequency.value = 2400;
    lpA.Q.value = 0.7;

    const gainA = ctx.createGain();
    gainA.gain.value = 0.30;

    srcA.connect(lpA);
    lpA.connect(gainA);
    gainA.connect(out);
    srcA.start(0, Math.random() * 3);
    trackNode(srcA);

    const srcB = ctx.createBufferSource();
    srcB.buffer = buf.brown;
    srcB.loop = true;

    const lpB = ctx.createBiquadFilter();
    lpB.type = 'lowpass';
    lpB.frequency.value = 150;

    const gainB = ctx.createGain();
    gainB.gain.value = 0.26;

    srcB.connect(lpB);
    lpB.connect(gainB);
    gainB.connect(out);
    srcB.start(0, Math.random() * 3);
    trackNode(srcB);

    /* 雨点颗粒 */
    trackFn(scheduleLoop(ctx, function (t) {
      rainTick(ctx, out, t, buf.white);
      return t + 0.12 + Math.random() * 0.35;
    }, 4.0, 250));

  } else if (cfg.kind === 'candle') {
    /* 极轻的气流底：不仔细听几乎没有 */
    const srcAir = ctx.createBufferSource();
    srcAir.buffer = buf.pink;
    srcAir.loop = true;

    const lpAir = ctx.createBiquadFilter();
    lpAir.type = 'lowpass';
    lpAir.frequency.value = 380;
    lpAir.Q.value = 0.6;

    const airGain = ctx.createGain();
    airGain.gain.value = 0.05;

    srcAir.connect(lpAir);
    lpAir.connect(airGain);
    airGain.connect(out);
    srcAir.start(0, Math.random() * 3);
    trackNode(srcAir);

    /* 烛芯噼啪：1.2–5.4 秒一下 */
    trackFn(scheduleLoop(ctx, function (t) {
      candlePop(ctx, out, t, buf.white);
      return t + 1.2 + Math.random() * 4.2;
    }, 6.0, 300));

  } else {
    /* 夜风：低频主体 + 高频叶响，比清风版整体低一个八度 */
    const srcLo = ctx.createBufferSource();
    srcLo.buffer = buf.pink;
    srcLo.loop = true;

    const bpLo = ctx.createBiquadFilter();
    bpLo.type = 'bandpass';
    bpLo.frequency.value = 330;
    bpLo.Q.value = 0.55;

    const loGain = ctx.createGain();
    loGain.gain.value = 0.40;

    srcLo.connect(bpLo);
    bpLo.connect(loGain);
    loGain.connect(out);
    srcLo.start(0, Math.random() * 3);
    trackNode(srcLo);

    trackFn(scheduleStrokes(ctx, loGain.gain, {
      minAtk: 1.4, maxAtk: 3.2, minHold: 0.8, maxHold: 2.4,
      minRel: 1.4, maxRel: 3.2, minRest: 0.02, maxRest: 0.08,
      minPeak: 0.34, maxPeak: 0.62
    }));

    /* 叶响：更慢、更弱 */
    const srcHi = ctx.createBufferSource();
    srcHi.buffer = buf.pink;
    srcHi.loop = true;

    const hpHi = ctx.createBiquadFilter();
    hpHi.type = 'highpass';
    hpHi.frequency.value = 1400;

    const hiGain = ctx.createGain();
    hiGain.gain.value = 0.05;

    srcHi.connect(hpHi);
    hpHi.connect(hiGain);
    hiGain.connect(out);
    srcHi.start(0, Math.random() * 3);
    trackNode(srcHi);

    trackFn(scheduleStrokes(ctx, hiGain.gain, {
      minAtk: 1.8, maxAtk: 4.0, minHold: 1.0, maxHold: 3.0,
      minRel: 1.8, maxRel: 4.0, minRest: 0.02, maxRest: 0.10,
      minPeak: 0.02, maxPeak: 0.09
    }));

    /* 极低频：远处的空旷感 */
    const srcDeep = ctx.createBufferSource();
    srcDeep.buffer = buf.brown;
    srcDeep.loop = true;

    const lpDeep = ctx.createBiquadFilter();
    lpDeep.type = 'lowpass';
    lpDeep.frequency.value = 90;

    const deepGain = ctx.createGain();
    deepGain.gain.value = 0.16;

    srcDeep.connect(lpDeep);
    lpDeep.connect(deepGain);
    deepGain.connect(out);
    srcDeep.start(0, Math.random() * 3);
    trackNode(srcDeep);
  }

  return {
    name: name,
    out: out,
    stop: function () {
      kill.forEach(function (fn) { fn(); });
      kill.length = 0;
    }
  };
}

/* ============================================================
   5. 主链路与切换
   ============================================================ */
function initAudio() {
  if (A.ready) return A;
  const ctx = ensureCtx();
  if (!ctx) return null;

  getBuffers(ctx);

  const master = ctx.createGain();
  master.gain.value = 0;

  /* 软削波：y = tanh(x)，音量拉满也不会撞到 1.0 */
  const pre = ctx.createGain();
  pre.gain.value = 0.5;

  const shaper = ctx.createWaveShaper();
  const curve = new Float32Array(2048);
  for (let i = 0; i < curve.length; i++) {
    const x = (i * 2) / (curve.length - 1) - 1;
    curve[i] = Math.tanh(2 * x);
  }
  shaper.curve = curve;
  shaper.oversample = '2x';

  master.connect(pre);
  pre.connect(shaper);
  shaper.connect(ctx.destination);

  A.ctx = ctx;
  A.master = master;
  A.ready = true;

  applySound(currentSound, true);
  return A;
}

/* 切换声音：新声源淡入，旧声源淡出后停掉 */
function applySound(name, instant) {
  if (!SOUNDS[name]) return;
  if (A.active && A.active.name === name) { currentSound = name; renderAll(); return; }

  currentSound = name;
  if (!A.ready) { renderAll(); return; }

  const ctx = A.ctx;
  const next = buildSound(ctx, name);
  next.out.gain.value = 0;
  next.out.connect(A.master);

  const t = ctx.currentTime;
  const fade = instant ? 0.05 : 0.5;
  next.out.gain.setValueAtTime(0.0001, t);
  next.out.gain.linearRampToValueAtTime(SOUNDS[name].trim, t + fade);

  if (A.active) {
    const old = A.active;
    const g = old.out.gain;
    if (typeof g.cancelAndHoldAtTime === 'function') g.cancelAndHoldAtTime(t);
    else {
      g.cancelScheduledValues(t);
      g.setValueAtTime(Math.max(0.0001, g.value), t);
    }
    g.linearRampToValueAtTime(0.0001, t + 0.35);
    setTimeout(function () {
      try { old.out.disconnect(); } catch (err) {}
      old.stop();
    }, 800);
  }

  A.active = next;
}

function volumeGain() {
  const v = Number(document.getElementById('vol').value) / 100;
  return Math.pow(v, 1.5) * CFG.MAX_GAIN;
}

function fadeTo(target, seconds) {
  if (!A.ready) return;
  const g = A.master.gain;
  const now = A.ctx.currentTime;
  if (typeof g.cancelAndHoldAtTime === 'function') g.cancelAndHoldAtTime(now);
  else {
    g.cancelScheduledValues(now);
    g.setValueAtTime(Math.max(0.0001, g.value), now);
  }
  g.linearRampToValueAtTime(Math.max(0.0001, target), now + seconds);
}

/* 结束提示音：两声柔和的正弦 */
function chime() {
  if (!A.ready) return;
  const ctx = A.ctx;
  const t = ctx.currentTime;

  [660, 990].forEach(function (freq, i) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;

    const peak = i === 0 ? 0.16 : 0.07;
    gain.gain.setValueAtTime(0.0001, t + i * 0.16);
    gain.gain.linearRampToValueAtTime(peak, t + i * 0.16 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.16 + 1.6);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t + i * 0.16);
    osc.stop(t + i * 0.16 + 1.7);
  });
}

/* ============================================================
   6. 计时器
   ============================================================ */
const T = {
  durationMs: 45 * 60000,
  remainMs: 45 * 60000,
  endAt: 0,
  running: false,
  finished: false,
  tickId: 0
};

function fmt(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function tick() {
  const left = T.endAt - performance.now();
  if (left <= 0) {
    T.remainMs = 0;
    finish();
    return;
  }
  T.remainMs = left;
  renderTime();
}

function startTimer() {
  if (T.running) return;
  initAudio();
  if (!A.ready) { setHint('此浏览器不支持 Web Audio'); return; }
  ensureCtx();

  T.running = true;
  T.finished = false;
  T.endAt = performance.now() + T.remainMs;
  fadeTo(volumeGain(), CFG.FADE_IN);
  requestWakeLock();

  clearInterval(T.tickId);
  T.tickId = setInterval(tick, 200);
  renderAll();
}

function pauseTimer() {
  if (!T.running) return;
  T.remainMs = Math.max(0, T.endAt - performance.now());
  T.running = false;
  clearInterval(T.tickId);
  fadeTo(0, CFG.PAUSE_FADE);
  releaseWakeLock();
  renderAll();
}

function resetTimer() {
  T.running = false;
  T.finished = false;
  clearInterval(T.tickId);
  T.remainMs = T.durationMs;
  fadeTo(0, 0.4);
  releaseWakeLock();
  renderAll();
}

function finish() {
  T.running = false;
  T.finished = true;
  clearInterval(T.tickId);
  releaseWakeLock();
  fadeTo(0, CFG.FADE_OUT);
  chime();
  renderAll();
}

/* ============================================================
   7. UI 渲染
   ============================================================ */
const RING_C = 2 * Math.PI * 92;

function setHint(text) {
  document.getElementById('hint').textContent = text;
}

function renderTime() {
  document.getElementById('time').textContent = fmt(T.remainMs);
  const done = T.durationMs > 0 ? 1 - T.remainMs / T.durationMs : 0;
  document.getElementById('prog').style.strokeDashoffset = String(RING_C * (1 - done));
}

function renderAll() {
  renderTime();

  const main = document.getElementById('btnMain');
  const resetBtn = document.getElementById('btnReset');
  const chips = Array.from(document.querySelectorAll('#chips button'));

  if (T.running) {
    main.textContent = '暂停';
    resetBtn.hidden = true;
    setHint('进行中 · 跟着自己的节奏呼吸');
  } else if (T.finished) {
    main.textContent = '再来一次';
    resetBtn.hidden = false;
    setHint('时间到');
  } else if (T.remainMs < T.durationMs) {
    main.textContent = '继续';
    resetBtn.hidden = false;
    setHint('已暂停');
  } else {
    main.textContent = '开始';
    resetBtn.hidden = true;
    setHint('准备开始');
  }

  chips.forEach(function (b) {
    b.disabled = T.running;
    b.classList.toggle('on', Number(b.dataset.min) * 60000 === T.durationMs);
  });

  Array.from(document.querySelectorAll('#sounds button')).forEach(function (b) {
    b.classList.toggle('on', b.dataset.sound === currentSound);
  });
}

/* ============================================================
   8. 屏幕常亮（可用时）
   ============================================================ */
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function () { wakeLock = null; });
    }
  } catch (err) { /* 不支持或被拒绝：忽略 */ }
}

function releaseWakeLock() {
  if (wakeLock) {
    try { wakeLock.release(); } catch (err) {}
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && T.running) {
    tick();
    requestWakeLock();
  }
});

/* ============================================================
   9. 事件绑定
   ============================================================ */
document.getElementById('btnMain').addEventListener('click', function () {
  if (T.running) {
    pauseTimer();
  } else {
    if (T.finished || T.remainMs <= 0) {
      T.remainMs = T.durationMs;
      T.finished = false;
    }
    startTimer();
  }
});

document.getElementById('btnReset').addEventListener('click', resetTimer);

document.getElementById('chips').addEventListener('click', function (e) {
  const btn = e.target.closest ? e.target.closest('button[data-min]') : null;
  if (!btn || T.running) return;
  const ms = Number(btn.dataset.min) * 60000;
  if (!Number.isFinite(ms) || ms <= 0) return;
  T.durationMs = ms;
  T.remainMs = ms;
  T.finished = false;
  renderAll();
});

document.getElementById('sounds').addEventListener('click', function (e) {
  const btn = e.target.closest ? e.target.closest('button[data-sound]') : null;
  if (!btn) return;
  applySound(btn.dataset.sound, false);
  renderAll();
});

document.getElementById('vol').addEventListener('input', function () {
  document.getElementById('volVal').textContent = this.value;
  if (A.ready) {
    A.master.gain.setTargetAtTime(volumeGain(), A.ctx.currentTime, 0.08);
  }
});

/* ============================================================
   10. 启动
   ============================================================ */
const prog = document.getElementById('prog');
prog.style.strokeDasharray = String(RING_C);
prog.style.strokeDashoffset = '0';
renderAll();
</script>
